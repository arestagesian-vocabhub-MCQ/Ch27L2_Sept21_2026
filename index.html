let currentIndex = 0;
let currentChances = 0;
let answeredCorrectly = false;

const vocabWordElem = document.getElementById("vocab-word");
const answersElem = document.getElementById("answers");
const farsiContextElem = document.getElementById("farsi-context");
const englishContextElem = document.getElementById("english-context");
const audioPlayer = document.getElementById("audio-player");
const backBtn = document.getElementById("back-btn");
const nextBtn = document.getElementById("next-btn");
const progressText = document.getElementById("progress-text");
const revealBtn = document.getElementById("reveal-btn");
const revealIndicator = document.getElementById("reveal-indicator");
const audioMCSection = document.getElementById("audio-mc-section");

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function loadWord(index) {
  const vocab = vocabData[index];
  currentChances = 0;
  answeredCorrectly = false;

  vocabWordElem.textContent = vocab.word;

  let options = [
    { text: vocab.correct, isCorrect: true },
    { text: vocab.distractors[0], isCorrect: false },
    { text: vocab.distractors[1], isCorrect: false },
  ];
  options = shuffleArray(options);

  answersElem.innerHTML = "";
  const colors = ["color-blue", "color-orange", "color-purple"];
  options.forEach((option, idx) => {
    const div = document.createElement("div");
    div.className = `answer-box ${colors[idx]}`;
    div.textContent = option.text;
    div.dataset.isCorrect = option.isCorrect;

    const feedbackSpan = document.createElement("span");
    feedbackSpan.className = "feedback";
    div.appendChild(feedbackSpan);

    div.addEventListener("click", () => {
      if (answeredCorrectly) return;
      if (div.classList.contains("disabled")) return;

      currentChances++;

      if (option.isCorrect) {
        feedbackSpan.textContent = "✅";
        answeredCorrectly = true;
        disableAllExcept(div);
        if (vocab.multipleChoice) showAudioMC(vocab.multipleChoice[0]);
      } else {
        feedbackSpan.textContent = "❌";
        if (currentChances >= 2) {
          showCorrectAnswer();
          disableAllExcept(null);
          if (vocab.multipleChoice) showAudioMC(vocab.multipleChoice[0]);
        } else {
          div.classList.add("disabled");
        }
      }
    });

    answersElem.appendChild(div);
  });

  farsiContextElem.textContent = vocab.farsiContext;
  farsiContextElem.classList.remove("context-clear");
  englishContextElem.textContent = "";
  revealBtn.disabled = true;
  revealBtn.classList.remove("active");
  revealIndicator.style.display = "none";

  audioPlayer.src = vocab.audio;
  audioPlayer.load();

  progressText.textContent = `Vocabulary ${index + 1} of ${vocabData.length}`;
  backBtn.disabled = index === 0;
  nextBtn.disabled = index === vocabData.length - 1;

  audioMCSection.style.display = "none";
}

function disableAllExcept(exceptDiv) {
  const answerBoxes = answersElem.querySelectorAll(".answer-box");
  answerBoxes.forEach(box => { if (box !== exceptDiv) box.classList.add("disabled"); });
}

function showCorrectAnswer() {
  const answerBoxes = answersElem.querySelectorAll(".answer-box");
  answerBoxes.forEach(box => { if (box.dataset.isCorrect === "true") box.querySelector(".feedback").textContent = "✅"; });
}

function showAudioMC(mcData) {
  if (!mcData) return;
  audioMCSection.style.display = "block";
  audioMCSection.innerHTML = "";

  const questionElem = document.createElement("p");
  questionElem.textContent = mcData.question;
  audioMCSection.appendChild(questionElem);

  mcData.options.forEach((opt, idx) => {
    const div = document.createElement("div");
    const colors = ["color-blue", "color-orange", "color-purple"];
    div.className = `answer-box ${colors[idx]}`;
    div.dataset.correct = opt.correct;
    div.textContent = opt.answer;

    const feedbackSpan = document.createElement("span");
    feedbackSpan.className = "feedback";
    div.appendChild(feedbackSpan);

    div.addEventListener("click", () => {
      if (div.classList.contains("disabled")) return;

      if (opt.correct) {
        feedbackSpan.textContent = "✅";
        revealBtn.disabled = false;
        revealBtn.classList.add("active");
        revealIndicator.style.display = "block";
        disableAllAudioExcept(div);
      } else {
        feedbackSpan.textContent = "❌";
        div.classList.add("disabled");
        const remaining = audioMCSection.querySelectorAll(".answer-box:not(.disabled)");
        if (remaining.length === 1) {
          remaining[0].querySelector(".feedback").textContent = "✅";
          revealBtn.disabled = false;
          revealBtn.classList.add("active");
          revealIndicator.style.display = "block";
          disableAllAudioExcept(remaining[0]);
        }
      }
    });

    audioMCSection.appendChild(div);
  });
}

function disableAllAudioExcept(exceptDiv) {
  const answerBoxes = audioMCSection.querySelectorAll(".answer-box");
  answerBoxes.forEach(box => { if (box !== exceptDiv) box.classList.add("disabled"); });
}

revealBtn.addEventListener("click", () => {
  farsiContextElem.classList.add("context-clear");
  englishContextElem.textContent = vocabData[currentIndex].englishContext;
  revealBtn.disabled = true;
  revealBtn.classList.remove("active");
  revealIndicator.style.display = "none";
});

backBtn.addEventListener("click", () => {
  if (currentIndex > 0) { currentIndex--; loadWord(currentIndex); }
});

nextBtn.addEventListener("click", () => {
  if (currentIndex < vocabData.length - 1) { currentIndex++; loadWord(currentIndex); }
});

loadWord(currentIndex);
</script>
<!-- celebration + feedback system -->
<style>
  #gif-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }

  .celebration-gif {
    position: absolute;
    object-fit: contain;
    animation: floatUp 2200ms cubic-bezier(.2,.9,.2,1) forwards;
    will-change: transform, opacity;
    user-select: none;
    -webkit-user-drag: none;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-160px) scale(1.45) rotate(20deg); }
  }

  #try-again {
    color: red;
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #try-again.show {
    opacity: 1;
  }
</style>

<div id="gif-container"></div>
<div id="try-again"></div>

<audio id="sound-correct" src="correct.mp3" preload="auto"></audio>
<audio id="sound-wrong" src="wrong.mp3" preload="auto"></audio>

<script>
(function(){
  const gifList = [
    "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
    "https://media.giphy.com/media/26gsiCIKW7ANEmxKE/giphy.gif",
    "https://media.giphy.com/media/3o7TKMt1VVNkHV2PaE/giphy.gif",
    "https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif"
  ];

  const container = document.getElementById("gif-container");
  const tryAgainEl = document.getElementById("try-again");
  const soundCorrect = document.getElementById("sound-correct");
  const soundWrong = document.getElementById("sound-wrong");

  function spawnGifAt(x, y) {
    const img = document.createElement("img");
    img.src = gifList[Math.floor(Math.random() * gifList.length)];
    img.className = "celebration-gif";

    const size = 60 + Math.floor(Math.random() * 120); // 60–180 px
    img.style.width = size + "px";
    img.style.height = size + "px";

    const offsetX = Math.floor(Math.random() * 120) - 60;
    const offsetY = Math.floor(Math.random() * 60) - 30;
    img.style.left = (x - size/2 + offsetX) + "px";
    img.style.top = (y - size/2 + offsetY) + "px";

    img.style.transform = `rotate(${Math.floor(Math.random() * 50) - 25}deg)`;

    container.appendChild(img);

    setTimeout(() => img.remove(), 2400);
  }

  function burstAt(x, y) {
    const count = 3 + Math.floor(Math.random() * 3); // 3–5 gifs
    for (let i = 0; i < count; i++) {
      setTimeout(() => spawnGifAt(
        x + Math.floor(Math.random()*50-25),
        y + Math.floor(Math.random()*30-15)
      ), i * 100);
    }
  }

  function showTryAgain() {
    tryAgainEl.textContent = "❌ Try again";
    tryAgainEl.classList.add("show");
    setTimeout(() => tryAgainEl.classList.remove("show"), 1500);
  }

  document.addEventListener("click", function(e) {
    const answerBox = e.target.closest(".answer-box");
    if (!answerBox) return;

    const isCorrect = answerBox.dataset.correct === "true" ||
                      answerBox.dataset.isCorrect === "true" ||
                      answerBox.getAttribute("data-is-correct") === "true";

    if (isCorrect) {
      soundCorrect.currentTime = 0;
      soundCorrect.play();
      burstAt(e.pageX || window.innerWidth/2, e.pageY || window.innerHeight/2);
    } else {
      soundWrong.currentTime = 0;
      soundWrong.play();
      showTryAgain();
    }
  });
})();
</script>
<!-- end celebration + feedback system -->
